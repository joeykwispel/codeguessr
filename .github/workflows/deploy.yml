# Deploys the site to GitHub Pages (https://codeguessr.joeyoosenbrug.nl) when a pull request is merged into main.
# Merging a PR is a push to main, so this is the trigger that fires on merge.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions", Custom domain: codeguessr.joeyoosenbrug.nl.
# Puzzles live in Supabase, so adding one doesn't need a deploy; the bundled snapshot only refreshes on the next deploy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # manual re-deploy from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run check

      - run: npm run test:unit

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/codeguessr/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
