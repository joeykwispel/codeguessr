# Weekly dependency updates, grouped so there is one PR per ecosystem instead of one per package.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # Angular packages must move together
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # TypeScript is pinned by Angular's peer range (e.g. >=6.0 <6.1); bump it with `ng update`
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Types must match the lowest supported Node (engines: >=22), not the newest release
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
